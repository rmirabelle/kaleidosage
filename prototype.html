<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaleido Sage</title>
<style>
  :root {
    --panel-bg: rgba(14, 14, 20, 0.78);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e8e8ef;
    --muted: #9a9aab;
    --accent: #8fd3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 12px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--text); }
  body.idle { cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 12px; right: 12px; width: 280px;
    max-height: calc(100vh - 24px); overflow-y: auto;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(10px);
    transition: opacity .3s;
  }
  #panel.hidden { opacity: 0; pointer-events: none; }
  #panel h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .04em; font-weight: 600; }
  #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }

  .row { margin: 6px 0 8px; }
  .row .top { display: flex; align-items: center; gap: 6px; }
  .row .name { flex: 1; }
  .row .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .row label.drift { display: flex; align-items: center; gap: 3px; color: var(--muted); cursor: pointer; }
  .row input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--accent); }

  select, button {
    font: inherit; color: var(--text); background: rgba(255,255,255,.07);
    border: 1px solid var(--panel-border); border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  select { width: 100%; }
  button:hover, select:hover { background: rgba(255,255,255,.13); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .keys { color: var(--muted); margin-top: 12px; line-height: 1.7; }
  .keys b { color: var(--text); font-weight: 600; display: inline-block; min-width: 38px; }

  #status {
    position: fixed; left: 14px; bottom: 12px; color: var(--muted);
    background: var(--panel-bg); padding: 4px 9px; border-radius: 6px;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  #status.show { opacity: 1; }
  #drop {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.6); font-size: 22px; border: 3px dashed var(--accent);
  }
  body.dragging #drop { display: grid; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="status"></div>
<div id="drop">Drop image here</div>
<input type="file" id="file" accept="image/*" hidden>

<script>
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);

/**
 * Parameters. "value" is the slider value. When drift is on:
 *  - "spin" params turn at "rate" degrees per second, starting at value.
 *  - "wave" params swing around value by +/- range at "rate" cycles per second.
 */
const params = {
  segments:  { label: 'Segments',      min: 0,   max: 24,  step: 1,    value: 8 },
  rotation:  { label: 'Rotation',      min: 0,   max: 360, step: 1,    value: 0,   unit: '°',  drift: 'spin', rate: 8,     on: true },
  zoom:      { label: 'Zoom',          min: 0.2, max: 4,   step: 0.01, value: 1.2,             drift: 'wave', range: 0.6,  rate: 0.05,  on: true },
  panX:      { label: 'Pan X',         min: -1,  max: 1,   step: 0.01, value: 0,               drift: 'wave', range: 0.35, rate: 0.031, on: true },
  panY:      { label: 'Pan Y',         min: -1,  max: 1,   step: 0.01, value: 0,               drift: 'wave', range: 0.35, rate: 0.023, on: true },
  twirl:     { label: 'Twirl',         min: -8,  max: 8,   step: 0.01, value: 0,               drift: 'wave', range: 3,    rate: 0.027, on: false },
  hue:       { label: 'Hue shift',     min: 0,   max: 360, step: 1,    value: 0,   unit: '°',  drift: 'spin', rate: 6,     on: false },
  blurAngle: { label: 'Blur angle',    min: 0,   max: 360, step: 1,    value: 30,  unit: '°',  drift: 'spin', rate: 12,    on: true },
  blurDist:  { label: 'Blur distance', min: 0,   max: 400, step: 1,    value: 90,  unit: 'px', drift: 'wave', range: 80,   rate: 0.043, on: true },
};
for (const p of Object.values(params)) { p.ph1 = rand(0, TAU); p.ph2 = rand(0, TAU); }

const state = { blurMode: 0, speed: 1, driftAmount: 1, paused: false, t: 0 };

function live(key) {
  const p = params[key];
  if (!p.drift || !p.on) return p.value;
  if (p.drift === 'spin') return (((p.value + state.t * p.rate) % 360) + 360) % 360;
  const w = 0.65 * Math.sin(TAU * p.rate * state.t + p.ph1)
          + 0.35 * Math.sin(TAU * p.rate * 2.618 * state.t + p.ph2);
  return clamp(p.value + p.range * state.driftAmount * w, p.min, p.max);
}

/* ---------- WebGL ---------- */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL2 is not available.</p>';

const VS = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

/**
 * Pass 1: kaleidoscope. Folds the screen angle into mirrored wedges,
 * then samples the source image with mirror-repeat.
 */
const FS_KALEIDO = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 o;
uniform sampler2D u_img;
uniform vec2 u_res;
uniform vec2 u_imgRes;
uniform float u_segments;
uniform float u_rotation;
uniform float u_zoom;
uniform float u_twirl;
uniform float u_hue;
uniform vec2 u_offset;
const float TAU = 6.28318530718;

vec3 hueShift(vec3 c, float h) {
  const vec3 k = vec3(0.57735);
  float ca = cos(h);
  return c * ca + cross(k, c) * sin(h) + k * dot(k, c) * (1.0 - ca);
}

void main() {
  vec2 p = (v_uv - 0.5) * vec2(u_res.x / u_res.y, 1.0);
  float r = length(p);
  float a = atan(p.y, p.x) + u_rotation + u_twirl * r;
  if (u_segments >= 1.0) {
    float seg = TAU / u_segments;
    a = abs(mod(a, seg) - seg * 0.5);
  }
  vec2 q = vec2(cos(a), sin(a)) * r / u_zoom;
  float imgAsp = u_imgRes.x / u_imgRes.y;
  vec2 uv = q * vec2(1.0 / imgAsp, 1.0) + 0.5 + u_offset;
  uv = 1.0 - abs(1.0 - mod(uv, 2.0));
  /** Explicit gradients avoid seams where the fold makes the angle jump. */
  float g = max(length(dFdx(p)), length(dFdy(p))) / u_zoom;
  vec3 c = textureGrad(u_img, uv, vec2(g / imgAsp, 0.0), vec2(0.0, g)).rgb;
  if (u_hue != 0.0) c = clamp(hueShift(c, u_hue), 0.0, 1.0);
  o = vec4(c, 1.0);
}`;

/**
 * Pass 2: motion blur. Mode 0 = linear (angle + distance),
 * 1 = radial (zoom), 2 = spin. Per-pixel jitter hides banding.
 */
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 o;
uniform sampler2D u_tex;
uniform vec2 u_res;
uniform int u_mode;
uniform vec2 u_dir;
uniform float u_amount;
uniform int u_samples;

float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

void main() {
  float aspect = u_res.x / u_res.y;
  vec2 dir = u_dir;
  if (u_mode != 0) {
    vec2 p = (v_uv - 0.5) * vec2(aspect, 1.0);
    vec2 d = u_mode == 1 ? p : vec2(-p.y, p.x);
    dir = d * u_amount / vec2(aspect, 1.0);
  }
  float j = ign(gl_FragCoord.xy) - 0.5;
  float n = float(u_samples);
  vec3 acc = vec3(0.0);
  for (int i = 0; i < u_samples; i++) {
    float t = (float(i) + 0.5 + j) / n - 0.5;
    acc += texture(u_tex, v_uv + dir * t).rgb;
  }
  o = vec4(acc / n, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function program(fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'a_pos');
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const u = {};
  const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(pr, i).name;
    u[name] = gl.getUniformLocation(pr, name);
  }
  return { pr, u };
}

const kaleido = program(FS_KALEIDO);
const blur = program(FS_BLUR);

/** One triangle that covers the whole screen. */
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const imgTex = gl.createTexture();
let imgRes = [1, 1];

const fboTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, fboTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
const fbo = gl.createFramebuffer();
let fboSize = [0, 0];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (w === fboSize[0] && h === fboSize[1]) return;
  canvas.width = w;
  canvas.height = h;
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
  fboSize = [w, h];
}

function setImage(source) {
  /** Scale down very large images so they fit in GPU limits. */
  const maxSide = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
  let w = source.naturalWidth || source.width;
  let h = source.naturalHeight || source.height;
  let src = source;
  if (Math.max(w, h) > maxSide) {
    const s = maxSide / Math.max(w, h);
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(source, 0, 0, w, h);
    src = c;
  }
  gl.bindTexture(gl.TEXTURE_2D, imgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  imgRes = [w, h];
}

/* ---------- Render loop ---------- */

let last = performance.now();
let wantSnapshot = false;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!state.paused) state.t += dt * state.speed;

  resize();
  const [w, h] = fboSize;
  const deg = Math.PI / 180;

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, w, h);
  gl.useProgram(kaleido.pr);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, imgTex);
  gl.uniform1i(kaleido.u.u_img, 0);
  gl.uniform2f(kaleido.u.u_res, w, h);
  gl.uniform2f(kaleido.u.u_imgRes, imgRes[0], imgRes[1]);
  gl.uniform1f(kaleido.u.u_segments, Math.round(params.segments.value));
  gl.uniform1f(kaleido.u.u_rotation, live('rotation') * deg);
  gl.uniform1f(kaleido.u.u_zoom, live('zoom'));
  gl.uniform1f(kaleido.u.u_twirl, live('twirl'));
  gl.uniform1f(kaleido.u.u_hue, live('hue') * deg);
  gl.uniform2f(kaleido.u.u_offset, live('panX'), live('panY'));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const ang = live('blurAngle') * deg;
  const dist = live('blurDist');
  const amount = dist / 500;
  const pxLen = state.blurMode === 0 ? dist * h / 1080 : amount * h * 0.9;
  const samples = clamp(Math.ceil(pxLen * 0.75), 1, 160);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(blur.pr);
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(blur.u.u_tex, 0);
  gl.uniform2f(blur.u.u_res, w, h);
  gl.uniform1i(blur.u.u_mode, state.blurMode);
  gl.uniform2f(blur.u.u_dir, Math.cos(ang) * dist / 1080 * (h / w), Math.sin(ang) * dist / 1080);
  gl.uniform1f(blur.u.u_amount, amount);
  gl.uniform1i(blur.u.u_samples, samples);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (wantSnapshot) {
    wantSnapshot = false;
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `kaleido-${Date.now()}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    });
  }

  updateReadouts();
  requestAnimationFrame(frame);
}

/* ---------- Images ---------- */

const statusEl = document.getElementById('status');
let statusTimer;
function status(msg, ms = 2000) {
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => statusEl.classList.remove('show'), ms);
}

function loadUrl(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function randomImage() {
  status('Loading random image…', 0);
  try {
    const img = await loadUrl(`https://picsum.photos/1920/1080?random=${Date.now()}`);
    setImage(img);
    status('New image');
  } catch {
    setImage(fallbackImage());
    status('Could not load a random image. Using a built-in pattern.', 3000);
  }
}

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  loadUrl(url).then(img => { setImage(img); status(file.name || 'Image loaded'); })
    .catch(() => status('Could not read that image'))
    .finally(() => URL.revokeObjectURL(url));
}

function fallbackImage() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 768;
  const x = c.getContext('2d');
  x.fillStyle = '#111'; x.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 40; i++) {
    const g = x.createRadialGradient(rand(0, 1024), rand(0, 768), 0, rand(0, 1024), rand(0, 768), rand(60, 300));
    g.addColorStop(0, `hsla(${rand(0, 360)},90%,60%,0.9)`);
    g.addColorStop(1, 'transparent');
    x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  }
  return c;
}

/* ---------- UI ---------- */

const panel = document.getElementById('panel');
const fileInput = document.getElementById('file');
const readouts = {};
const sliders = {};

function fmt(p, v) {
  const d = p.step < 1 ? 2 : 0;
  return v.toFixed(d) + (p.unit || '');
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

function sliderRow(p, onInput, key) {
  const val = el('span', { className: 'val' }, fmt(p, p.value));
  const s = el('input', {
    type: 'range', min: p.min, max: p.max, step: p.step, value: p.value,
    oninput: () => { onInput(+s.value); val.textContent = fmt(p, +s.value); },
  });
  const top = el('div', { className: 'top' }, el('span', { className: 'name' }, p.label), val);
  if (p.drift) {
    const cb = el('input', { type: 'checkbox', checked: p.on, onchange: () => { p.on = cb.checked; } });
    p.checkbox = cb;
    top.append(el('label', { className: 'drift', title: 'Animate this value' }, cb, 'drift'));
  }
  if (key) { readouts[key] = val; sliders[key] = s; }
  return el('div', { className: 'row' }, top, s);
}

function buildPanel() {
  panel.append(el('h1', {}, 'Kaleido Sage'));

  panel.append(el('h2', {}, 'Kaleidoscope'));
  for (const k of ['segments', 'rotation', 'zoom', 'panX', 'panY', 'twirl', 'hue']) {
    panel.append(sliderRow(params[k], v => { params[k].value = v; }, k));
  }

  panel.append(el('h2', {}, 'Motion blur'));
  const mode = el('select', { onchange: () => { state.blurMode = +mode.value; } },
    el('option', { value: 0 }, 'Linear'),
    el('option', { value: 1 }, 'Radial (zoom)'),
    el('option', { value: 2 }, 'Spin'));
  panel.append(el('div', { className: 'row' }, mode));
  for (const k of ['blurAngle', 'blurDist']) {
    panel.append(sliderRow(params[k], v => { params[k].value = v; }, k));
  }

  panel.append(el('h2', {}, 'Animation'));
  panel.append(sliderRow({ label: 'Speed', min: 0, max: 4, step: 0.01, value: state.speed }, v => { state.speed = v; }));
  panel.append(sliderRow({ label: 'Drift amount', min: 0, max: 2, step: 0.01, value: state.driftAmount }, v => { state.driftAmount = v; }));

  panel.append(el('h2', {}, 'Image'));
  panel.append(el('div', { className: 'buttons' },
    el('button', { onclick: randomImage }, 'Random image'),
    el('button', { onclick: () => fileInput.click() }, 'Open image…'),
    el('button', { onclick: randomizeSettings }, 'Randomize'),
    el('button', { onclick: () => { wantSnapshot = true; } }, 'Save PNG'),
  ));
  panel.append(el('button', { style: 'width:100%;margin-top:6px', onclick: toggleFullscreen }, 'Full screen'));

  const keys = [['F', 'full screen'], ['H', 'hide panel'], ['Space', 'pause'], ['R', 'random image'],
    ['O', 'open image'], ['X', 'randomize'], ['S', 'save PNG']];
  panel.append(el('div', { className: 'keys' },
    ...keys.flatMap(([k, d]) => [el('b', {}, k), d, el('br')]),
    'Drop or paste an image anywhere.'));
}

/** Show live (drifting) values. The slider stays at the center value. */
function updateReadouts() {
  for (const [k, r] of Object.entries(readouts)) {
    const p = params[k];
    if (!p.drift || !p.on) continue;
    const s = fmt(p, live(k));
    if (r.textContent !== s) r.textContent = s;
  }
}

function setParam(k, v) {
  const p = params[k];
  p.value = clamp(v, p.min, p.max);
  sliders[k].value = p.value;
  readouts[k].textContent = fmt(p, p.value);
}

function randomizeSettings() {
  setParam('segments', [0, 3, 4, 5, 6, 6, 8, 8, 10, 12, 16][Math.floor(Math.random() * 11)]);
  setParam('rotation', rand(0, 360));
  setParam('zoom', rand(0.5, 2.5));
  setParam('panX', rand(-0.5, 0.5));
  setParam('panY', rand(-0.5, 0.5));
  setParam('twirl', Math.random() < 0.4 ? rand(-4, 4) : 0);
  setParam('hue', rand(0, 360));
  setParam('blurAngle', rand(0, 360));
  setParam('blurDist', rand(20, 250));
  for (const k of ['rotation', 'blurAngle', 'hue']) params[k].rate = rand(-20, 20);
  params.twirl.checkbox.checked = params.twirl.on = Math.random() < 0.5;
  params.hue.checkbox.checked = params.hue.on = Math.random() < 0.4;
  status('Randomized');
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  switch (e.key.toLowerCase()) {
    case 'f': toggleFullscreen(); break;
    case 'h': panel.classList.toggle('hidden'); break;
    case ' ': state.paused = !state.paused; status(state.paused ? 'Paused' : 'Playing'); e.preventDefault(); break;
    case 'r': randomImage(); break;
    case 'o': fileInput.click(); break;
    case 'x': randomizeSettings(); break;
    case 's': wantSnapshot = true; break;
    default: return;
  }
});

canvas.addEventListener('dblclick', toggleFullscreen);
fileInput.addEventListener('change', () => { loadFile(fileInput.files[0]); fileInput.value = ''; });

window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});
window.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

/** Hide the cursor after 2 s without mouse movement. */
let idleTimer;
window.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000);
});

/* ---------- Start ---------- */

buildPanel();
setImage(fallbackImage());
randomImage();
requestAnimationFrame(frame);
</script>
</body>
</html>
