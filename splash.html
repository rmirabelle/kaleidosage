<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22252f" />
    <title>Kaleido Sage</title>
    <!--
      The splash window shows this page while the main window loads behind it.
      It has no script, so it paints the moment the webview reads it. Its look
      matches the start screen (StartScreen.tsx: the dotted background, the
      icon's glow, the name and the subtitle), with the icon at the left of
      the name. Vite fills in the version (see vite.config.ts).
    -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-color: #22252f;
        background-image: radial-gradient(rgba(75,118,247,.18) 1px, transparent 1px);
        background-size: 22px 22px;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      .splash { display: flex; align-items: center; gap: 22px; margin-top: -14px; }
      .icon { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
      .icon img { position: relative; width: 112px; height: 112px; display: block; }
      .glow { position: absolute; left: 50%; top: 50%; width: 380px; height: 300px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(75,118,247,.32), rgba(75,118,247,.20) 30%, rgba(75,118,247,.08) 60%, rgba(75,118,247,0)); }
      .name { color: #a9ddf8; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.035em; }
      h1 { margin: 8px 0 0; color: #4a4f5e; font-size: 21px; line-height: 1.2; letter-spacing: -.025em; }
      .corner { position: fixed; bottom: 12px; color: #5d6272; font-size: 10.5px; }
      .author { left: 16px; }
      .version { right: 16px; }
      .spinner {
        position: fixed;
        left: 50%;
        bottom: 26px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        border-radius: 50%;
        border: 2.5px solid rgba(255,255,255,.1);
        border-top-color: #4b76f7;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="icon"><div class="glow"></div><img src="/kaleido-sage-logo.png" alt="" width="112" height="112" /></div>
      <div>
        <div class="name">Kaleido Sage</div>
        <h1>Visual FX Playground</h1>
      </div>
    </div>
    <div class="spinner"></div>
    <span class="corner author">by Robert Mirabelle</span>
    <span class="corner version">Version %APP_VERSION%</span>
  </body>
</html>
