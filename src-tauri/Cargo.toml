[package]
name = "kaleidosage"
version = "0.14.0"
description = "Turn any image into a moving kaleidoscope"
authors = ["Rob Mirabelle"]
edition = "2021"

[lib]
name = "kaleidosage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
beat-this = { version = "1.1", default-features = false }
ebur128 = "0.1"
realfft = "3"

[dev-dependencies]
beat-this = { version = "1.1", default-features = false, features = ["decode"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Media_MediaProperties",
  "Media_Transcoding",
  "Storage",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

# The song analysis runs about 30 times slower unoptimized, so the dev app builds its crates optimized.
[profile.dev.package]
beat-this = { opt-level = 3 }
ebur128 = { opt-level = 3 }
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
rten = { opt-level = 3 }
rten-base = { opt-level = 3 }
rten-gemm = { opt-level = 3 }
rten-model-file = { opt-level = 3 }
rten-onnx = { opt-level = 3 }
rten-shape-inference = { opt-level = 3 }
rten-simd = { opt-level = 3 }
rten-tensor = { opt-level = 3 }
rten-vecmath = { opt-level = 3 }
